<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - 0xSoloh</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--green:#00FF41;--bg:#080808;--card:#111;--border:#222}
body{background:var(--bg);color:#ddd;font-family:monospace}
.card-m{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.form-hack{background:#000;border:1px solid var(--border);border-radius:8px;color:#fff;padding:8px 12px;width:100%}
.form-hack:focus{outline:none;border-color:var(--green)}
.nav-tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:#111;color:#888;cursor:pointer;margin:4px}
.nav-tab.active{background:var(--green);color:#000;font-weight:800;border-color:var(--green)}
</style></head><body>
<div class="container py-4" style="max-width:800px">
<h4 style="color:var(--green)"><i class="bi bi-shield-lock"></i> 0xSoloh Admin Panel</h4>
<small class="text-muted">Add content without coding. Then click Export JSON.</small>

<div class="mt-4 mb-3">
<button class="nav-tab active" onclick="showTab('writeups')" id="t-writeups">Writeups</button>
<button class="nav-tab" onclick="showTab('cheatsheets')" id="t-cheatsheets">Cheatsheets</button>
<button class="nav-tab" onclick="showTab('tools')" id="t-tools">Tools</button>
</div>

<!-- WRITEUPS TAB -->
<div id="tab-writeups" class="tab">
<div class="card-m">
<h6>Add New Writeup</h6>
<input id="w-title" class="form-hack mb-2" placeholder="Title - e.g. Mr Robot SUID">
<input id="w-file" class="form-hack mb-2" placeholder="File name - e.g. mr-robot-suid.md">
<select id="w-platform" class="form-hack mb-2"><option>HackTheBox</option><option>TryHackMe</option><option>Lab</option></select>
<input id="w-level" class="form-hack mb-2" placeholder="Level - Easy/Medium/Hard">
<input id="w-tags" class="form-hack mb-2" placeholder="Tags comma - e.g. privesc,suid">
<button onclick="addItem('writeups')" class="btn btn-sm w-100" style="background:var(--green);color:#000;font-weight:800">+ Add Writeup</button>
</div>
<div id="list-writeups"></div>
</div>

<!-- CHEATSHEETS TAB -->
<div id="tab-cheatsheets" class="tab" style="display:none">
<div class="card-m">
<h6>Add Cheatsheet</h6>
<input id="c-title" class="form-hack mb-2" placeholder="Title - e.g. Nmap Quick Ref">
<input id="c-icon" class="form-hack mb-2" placeholder="Icon emoji - e.g. 🔍 or bi-journal-code">
<input id="c-desc" class="form-hack mb-2" placeholder="Short description">
<input id="c-file" class="form-hack mb-2" placeholder="File - e.g. nmap.md (put file in /cheatsheets/)">
<button onclick="addItem('cheatsheets')" class="btn btn-sm w-100" style="background:#FFD54F;color:#000;font-weight:800">+ Add Cheatsheet</button>
</div>
<div id="list-cheatsheets"></div>
</div>

<!-- TOOLS TAB -->
<div id="tab-tools" class="tab" style="display:none">
<div class="card-m">
<h6>Add Tool</h6>
<input id="tl-title" class="form-hack mb-2" placeholder="Tool name - e.g. subfuzzer.sh">
<input id="tl-desc" class="form-hack mb-2" placeholder="Description">
<input id="tl-tags" class="form-hack mb-2" placeholder="Tags - e.g. bash,recon">
<input id="tl-link" class="form-hack mb-2" placeholder="GitHub Link - e.g. https://github.com/...">
<input id="tl-file" class="form-hack mb-2" placeholder="File - e.g. subfuzzer.md (put in /tools/)">
<button onclick="addItem('tools')" class="btn btn-sm w-100" style="background:var(--green);color:#000;font-weight:800">+ Add Tool</button>
</div>
<div id="list-tools"></div>
</div>

<hr style="border-color:#222" class="my-4">
<div class="card-m">
<h6>Export</h6>
<small class="text-muted">After adding, click to download updated JSONs. Replace your old JSONs with these.</small>
<div class="d-grid gap-2 mt-3">
<button onclick="exportJSON('writeups')" class="btn btn-outline-light btn-sm">Download writeups.json</button>
<button onclick="exportJSON('cheatsheets')" class="btn btn-outline-warning btn-sm">Download cheatsheets.json</button>
<button onclick="exportJSON('tools')" class="btn btn-outline-success btn-sm">Download tools.json</button>
</div>
</div>

<a href="index.html" class="btn btn-sm mt-3" style="border:1px solid #333;color:#888">← Back to Site</a>
</div>

<script>
let data={writeups:JSON.parse(localStorage.getItem('w')||'[]'),cheatsheets:JSON.parse(localStorage.getItem('c')||'[]'),tools:JSON.parse(localStorage.getItem('t')||'[]')};
function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).style.display='block';
  document.getElementById('t-'+name).classList.add('active');
  render();
}
function addItem(type){
  let item;
  if(type==='writeups'){
    const title=document.getElementById('w-title').value; const file=document.getElementById('w-file').value;
    if(!title||!file) return alert('Title + File needed');
    item={title,file,platform:document.getElementById('w-platform').value,level:document.getElementById('w-level').value||'Medium',date:new Date().toISOString().slice(0,10),tags:document.getElementById('w-tags').value.split(',').map(s=>s.trim()).filter(Boolean)};
    data.writeups.unshift(item);
    localStorage.setItem('w',JSON.stringify(data.writeups));
  }
  if(type==='cheatsheets'){
    const title=document.getElementById('c-title').value; const file=document.getElementById('c-file').value;
    if(!title) return alert('Title needed');
    item={title,icon:document.getElementById('c-icon').value||'📄',desc:document.getElementById('c-desc').value||'',file};
    data.cheatsheets.unshift(item);
    localStorage.setItem('c',JSON.stringify(data.cheatsheets));
  }
  if(type==='tools'){
    const title=document.getElementById('tl-title').value;
    if(!title) return alert('Title needed');
    item={title,desc:document.getElementById('tl-desc').value||'',tags:document.getElementById('tl-tags').value.split(',').map(s=>s.trim()).filter(Boolean),link:document.getElementById('tl-link').value||'#',file:document.getElementById('tl-file').value||''};
    data.tools.unshift(item);
    localStorage.setItem('t',JSON.stringify(data.tools));
  }
  render(); alert('Added! Now Export JSON below.');
}
function render(){
  document.getElementById('list-writeups').innerHTML=data.writeups.map((x,i)=>`<div class="card-m small d-flex justify-content-between"><span>${x.title} - ${x.file}</span><span style="cursor:pointer;color:#ff5f56" onclick="del('writeups',${i})">x</span></div>`).join('');
  document.getElementById('list-cheatsheets').innerHTML=data.cheatsheets.map((x,i)=>`<div class="card-m small d-flex justify-content-between"><span>${x.icon} ${x.title}</span><span style="cursor:pointer;color:#ff5f56" onclick="del('cheatsheets',${i})">x</span></div>`).join('');
  document.getElementById('list-tools').innerHTML=data.tools.map((x,i)=>`<div class="card-m small d-flex justify-content-between"><span>🛠️ ${x.title}</span><span style="cursor:pointer;color:#ff5f56" onclick="del('tools',${i})">x</span></div>`).join('');
}
function del(type,i){
  if(!confirm('Delete?')) return;
  data[type].splice(i,1);
  localStorage.setItem(type==='writeups'?'w':type==='cheatsheets'?'c':'t',JSON.stringify(data[type]));
  render();
}
function exportJSON(type){
  const blob=new Blob([JSON.stringify(data[type],null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=type+'.json'; a.click();
}
render();
</script></body></html>

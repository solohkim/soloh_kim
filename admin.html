<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--green:#00FF41;--gold:#FFD54F;--bg:#080808;--card:#111;--border:#222}
body{background:var(--bg);color:#ddd;font-family:monospace}
.card-m{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.form-hack{background:#000;border:1px solid var(--border);border-radius:8px;color:#fff;padding:8px 12px;width:100%}
.form-hack:focus{outline:none;border-color:var(--green)}
.nav-tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:#111;color:#888;cursor:pointer;margin:4px}

<div id="adminLock" style="position:fixed;inset:0;background:#080808;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column">
  <div style="background:#111;border:1px solid #1f1f1f;border-radius:14px;padding:30px;max-width:380px;width:90%;text-align:center;box-shadow:0 0 30px rgba(0,255,65,.15)">
    <div style="color:#00FF41;font-weight:800;font-size:1.2rem;margin-bottom:10px">🔒 0xSoloh Admin</div>
    <small style="color:#666;display:block;margin-bottom:15px">Enter private key to access</small>
    <input type="password" id="adminPass" placeholder="Enter admin key" style="background:#0a0a0a;border:1px solid #222;border-radius:8px;color:#ddd;padding:12px;width:100%;margin-bottom:12px">
    <button onclick="checkAdmin()" style="background:#00FF41;color:#000;font-weight:800;border:none;border-radius:8px;padding:10px;width:100%;cursor:pointer">Unlock</button>
    <small id="lockMsg" style="color:#ff5f56;display:none;margin-top:10px">Wrong key</small>
  </div>
</div>
<script>
const ADMIN_KEY = "kimsec254";
let idleTimer;
function checkAdmin(){
  const v = document.getElementById('adminPass').value;
  if(v === ADMIN_KEY){
    document.getElementById('adminLock').style.display='none';
    startIdleTimer();
    loadExistingFromServer();
  } else {
    document.getElementById('lockMsg').style.display='block';
  }
}
function lockAgain(){document.getElementById('adminLock').style.display='flex'; clearTimeout(idleTimer);}
function startIdleTimer(){clearTimeout(idleTimer); idleTimer=setTimeout(lockAgain,180000);}
['mousemove','keydown','click','scroll'].forEach(evt=>{document.addEventListener(evt, ()=>{if(document.getElementById('adminLock').style.display==='none'){startIdleTimer();}});});
document.addEventListener('keydown', (e)=>{const lock=document.getElementById('adminLock'); if(e.key==='Enter' && lock && lock.style.display!=='none'){checkAdmin();}});
</script>

<script>
let data={
  writeups:JSON.parse(localStorage.getItem('w')||'[]'),
  cheatsheets:JSON.parse(localStorage.getItem('c')||'[]'),
  tools:JSON.parse(localStorage.getItem('t')||'[]'),
  stats:JSON.parse(localStorage.getItem('s')||'[]'),
  about:JSON.parse(localStorage.getItem('about')||'null')
};
let editIndex={writeups:null,cheatsheets:null,tools:null,stats:null};
let serverLoaded=false;

async function loadExistingFromServer(){
  const status=document.getElementById('loadStatus');
  status.textContent='⏳ Loading...'; status.style.color='#FFD54F';
  try{
    for(let type of ['writeups','cheatsheets','tools','stats']){
      try{
        const res=await fetch(type+'.json?cachebust='+Date.now());
        if(res.ok){
          const json=await res.json();
          if(Array.isArray(json)&&json.length>0){
            if(!serverLoaded||data[type].length===0){
              data[type]=json;
              localStorage.setItem(type==='writeups'?'w':type==='cheatsheets'?'c':type==='tools'?'t':'s',JSON.stringify(json));
            }
          }
        }
      }catch(e){}
    }
    try{
      const res=await fetch('about.json?cachebust='+Date.now());
      if(res.ok){
        const json=await res.json();
        if(json&&json.name){
          data.about=json;
          localStorage.setItem('about',JSON.stringify(json));
          fillAboutForm(json);
        }
      }
    }catch(e){}
    serverLoaded=true;
    status.textContent=`✅ Loaded: ${data.writeups.length} writeups, ${data.cheatsheets.length} cheatsheets, ${data.tools.length} tools, ${data.stats.length} stats`;
    status.style.color='#00FF41';
    render();
  }catch(e){
    status.textContent='⚠️ Could not auto-load. Use Import.';
    status.style.color='#ff5f56';
  }
}

function fillAboutForm(a){
  document.getElementById('a-name').value=a.name||'';
  document.getElementById('a-fullName').value=a.fullName||'';
  document.getElementById('a-role').value=a.role||'';
  document.getElementById('a-location').value=a.location||'';
  document.getElementById('a-bio').value=a.bio||'';
  document.getElementById('a-mission').value=a.mission||'';
  document.getElementById('a-badges').value=a.badges||'';
  document.getElementById('a-contactNote').value=a.contactNote||'';
  if(a.skills) document.getElementById('a-skills').value=a.skills.map(s=>`${s.name}:${s.level}`).join(', ');
}
function saveAbout(){
  const skillsRaw=document.getElementById('a-skills').value;
  const skills=skillsRaw.split(',').map(s=>s.trim()).filter(Boolean).map(pair=>{
    const [name,level]=pair.split(':').map(x=>x.trim());
    return {name:name||'Skill',level:parseInt(level)||80};
  });
  data.about={name:document.getElementById('a-name').value||'0xSoloh',fullName:document.getElementById('a-fullName').value||'Soloh Kim',role:document.getElementById('a-role').value,location:document.getElementById('a-location').value,bio:document.getElementById('a-bio').value,mission:document.getElementById('a-mission').value,badges:document.getElementById('a-badges').value,contactNote:document.getElementById('a-contactNote').value,skills};
  localStorage.setItem('about',JSON.stringify(data.about));
  document.getElementById('aboutPreview').textContent=JSON.stringify(data.about,null,2);
  alert('About saved!');
}
function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).style.display='block';
  document.getElementById('t-'+name).classList.add('active');
  render();
}
function addItem(type){
  let item;
  if(type==='writeups'){
    const title=document.getElementById('w-title').value; const file=document.getElementById('w-file').value;
    if(!title||!file) return alert('Title + File needed');
    item={title,file,platform:document.getElementById('w-platform').value,level:document.getElementById('w-level').value||'Medium',date:new Date().toISOString().slice(0,10),tags:document.getElementById('w-tags').value.split(',').map(s=>s.trim()).filter(Boolean),image:document.getElementById('w-image').value||'',desc:''};
    if(editIndex.writeups!==null){data.writeups[editIndex.writeups]=item; editIndex.writeups=null;}else{data.writeups.unshift(item);}
    localStorage.setItem('w',JSON.stringify(data.writeups));
    cancelEdit('writeups');
  }
  if(type==='cheatsheets'){
    const title=document.getElementById('c-title').value; const file=document.getElementById('c-file').value;
    if(!title) return alert('Title needed');
    item={title,icon:document.getElementById('c-icon').value||'📄',desc:document.getElementById('c-desc').value||'',file};
    if(editIndex.cheatsheets!==null){data.cheatsheets[editIndex.cheatsheets]=item; editIndex.cheatsheets=null;}else{data.cheatsheets.unshift(item);}
    localStorage.setItem('c',JSON.stringify(data.cheatsheets));
    cancelEdit('cheatsheets');
  }
  if(type==='tools'){
    const title=document.getElementById('tl-title').value;
    if(!title) return alert('Title needed');
    item={title,desc:document.getElementById('tl-desc').value||'',tags:document.getElementById('tl-tags').value.split(',').map(s=>s.trim()).filter(Boolean),link:document.getElementById('tl-link').value||'#',file:document.getElementById('tl-file').value||''};
    if(editIndex.tools!==null){data.tools[editIndex.tools]=item; editIndex.tools=null;}else{data.tools.unshift(item);}
    localStorage.setItem('t',JSON.stringify(data.tools));
    cancelEdit('tools');
  }
  if(type==='stats'){
    const platform=document.getElementById('s-platform').value; const rank=document.getElementById('s-rank').value;
    if(!rank) return alert('Rank needed');
    item={platform,rank,icon:document.getElementById('s-icon').value||'bi-trophy',link:document.getElementById('s-link').value||'#',proof:document.getElementById('s-proof').value||'images/evidence/placeholder.png',date:new Date().toISOString().slice(0,10)};
    if(editIndex.stats!==null){data.stats[editIndex.stats]=item; editIndex.stats=null;}else{data.stats.unshift(item);}
    localStorage.setItem('s',JSON.stringify(data.stats));
    cancelEdit('stats');
  }
  render();
}
function editItem(type,i){
  const item=data[type][i];
  editIndex[type]=i;
  if(type==='writeups'){
    document.getElementById('w-title').value=item.title||'';
    document.getElementById('w-file').value=item.file||'';
    document.getElementById('w-platform').value=item.platform||'HackTheBox';
    document.getElementById('w-level').value=item.level||'';
    document.getElementById('w-tags').value=(item.tags||[]).join(', ');
    document.getElementById('w-image').value=item.image||'';
    document.getElementById('w-form-title').textContent='✏️ Editing Writeup';
    document.getElementById('w-btn').textContent='💾 Update Writeup';
    document.getElementById('w-btn').style.background='#FFD54F';
    document.getElementById('w-editing').style.display='block';
    document.getElementById('w-edit-index').textContent=i;
    showTab('writeups');
    window.scrollTo({top:0,behavior:'smooth'});
  }
  if(type==='cheatsheets'){
    document.getElementById('c-title').value=item.title||'';
    document.getElementById('c-icon').value=item.icon||'';
    document.getElementById('c-desc').value=item.desc||'';
    document.getElementById('c-file').value=item.file||'';
    document.getElementById('c-form-title').textContent='✏️ Editing Cheatsheet';
    document.getElementById('c-btn').textContent='💾 Update Cheatsheet';
    document.getElementById('c-editing').style.display='block';
    document.getElementById('c-edit-index').textContent=i;
    showTab('cheatsheets');
    window.scrollTo({top:0,behavior:'smooth'});
  }
  if(type==='tools'){
    document.getElementById('tl-title').value=item.title||'';
    document.getElementById('tl-desc').value=item.desc||'';
    document.getElementById('tl-tags').value=(item.tags||[]).join(', ');
    document.getElementById('tl-link').value=item.link||'';
    document.getElementById('tl-file').value=item.file||'';
    document.getElementById('tl-form-title').textContent='✏️ Editing Tool';
    document.getElementById('tl-btn').textContent='💾 Update Tool';
    document.getElementById('tl-editing').style.display='block';
    document.getElementById('tl-edit-index').textContent=i;
    showTab('tools');
    window.scrollTo({top:0,behavior:'smooth'});
  }
  if(type==='stats'){
    document.getElementById('s-platform').value=item.platform||'TryHackMe';
    document.getElementById('s-rank').value=item.rank||'';
    document.getElementById('s-icon').value=item.icon||'';
    document.getElementById('s-link').value=item.link||'';
    document.getElementById('s-proof').value=item.proof||'';
    document.getElementById('s-form-title').textContent='✏️ Editing Stat';
    document.getElementById('s-btn').textContent='💾 Update Stat';
    document.getElementById('s-editing').style.display='block';
    document.getElementById('s-edit-index').textContent=i;
    if(item.proof){document.getElementById('previewImg').src=item.proof; document.getElementById('proofPreview').style.display='block';}
    showTab('stats');
    window.scrollTo({top:0,behavior:'smooth'});
  }
}
function cancelEdit(type){
  editIndex[type]=null;
  if(type==='writeups'){
    document.getElementById('w-title').value=''; document.getElementById('w-file').value=''; document.getElementById('w-tags').value=''; document.getElementById('w-image').value=''; document.getElementById('w-level').value='';
    document.getElementById('w-form-title').textContent='Add New Writeup'; document.getElementById('w-btn').textContent='+ Add Writeup'; document.getElementById('w-btn').style.background='var(--green)'; document.getElementById('w-editing').style.display='none'; document.getElementById('w-preview').style.display='none';
  }
  if(type==='cheatsheets'){
    document.getElementById('c-title').value=''; document.getElementById('c-icon').value=''; document.getElementById('c-desc').value=''; document.getElementById('c-file').value='';
    document.getElementById('c-form-title').textContent='Add Cheatsheet'; document.getElementById('c-btn').textContent='+ Add Cheatsheet'; document.getElementById('c-editing').style.display='none';
  }
  if(type==='tools'){
    document.getElementById('tl-title').value=''; document.getElementById('tl-desc').value=''; document.getElementById('tl-tags').value=''; document.getElementById('tl-link').value=''; document.getElementById('tl-file').value='';
    document.getElementById('tl-form-title').textContent='Add Tool'; document.getElementById('tl-btn').textContent='+ Add Tool'; document.getElementById('tl-editing').style.display='none';
  }
  if(type==='stats'){
    document.getElementById('s-rank').value=''; document.getElementById('s-icon').value=''; document.getElementById('s-link').value=''; document.getElementById('s-proof').value='';
    document.getElementById('s-form-title').textContent='Add Stat / Badge'; document.getElementById('s-btn').textContent='+ Add Stat'; document.getElementById('s-editing').style.display='none'; document.getElementById('proofPreview').style.display='none';
  }
}
function render(){
  document.getElementById('list-writeups').innerHTML=data.writeups.map((x,i)=>`<div class="card-m small d-flex justify-content-between align-items-center"><span>${x.title} - ${x.file}</span><div><span style="cursor:pointer;color:var(--gold);margin-right:10px" onclick="editItem('writeups',${i})"><i class="bi bi-pencil"></i> Edit</span><span style="cursor:pointer;color:#ff5f56" onclick="del('writeups',${i})">x</span></div></div>`).join('');
  document.getElementById('list-cheatsheets').innerHTML=data.cheatsheets.map((x,i)=>`<div class="card-m small d-flex justify-content-between align-items-center"><span>${x.icon} ${x.title}</span><div><span style="cursor:pointer;color:var(--gold);margin-right:10px" onclick="editItem('cheatsheets',${i})"><i class="bi bi-pencil"></i> Edit</span><span style="cursor:pointer;color:#ff5f56" onclick="del('cheatsheets',${i})">x</span></div></div>`).join('');
  document.getElementById('list-tools').innerHTML=data.tools.map((x,i)=>`<div class="card-m small d-flex justify-content-between align-items-center"><span>🛠️ ${x.title}</span><div><span style="cursor:pointer;color:var(--gold);margin-right:10px" onclick="editItem('tools',${i})"><i class="bi bi-pencil"></i> Edit</span><span style="cursor:pointer;color:#ff5f56" onclick="del('tools',${i})">x</span></div></div>`).join('');
  document.getElementById('list-stats').innerHTML=data.stats.map((x,i)=>`<div class="card-m small d-flex justify-content-between align-items-center"><div><b>${x.platform}</b> - ${x.rank}<br><small style="color:#666">${x.proof}</small></div><div><span style="cursor:pointer;color:var(--gold);margin-right:10px" onclick="editItem('stats',${i})"><i class="bi bi-pencil"></i> Edit</span><span style="cursor:pointer;color:#ff5f56" onclick="del('stats',${i})">x</span></div></div>`).join('');
  document.getElementById('count-w').textContent=data.writeups.length;
  document.getElementById('count-c').textContent=data.cheatsheets.length;
  document.getElementById('count-t').textContent=data.tools.length;
  document.getElementById('count-s').textContent=data.stats.length;
  if(data.about) document.getElementById('aboutPreview').textContent=JSON.stringify(data.about,null,2);
}
function del(type,i){
  if(!confirm('Delete?')) return;
  data[type].splice(i,1);
  const key=type==='writeups'?'w':type==='cheatsheets'?'c':type==='tools'?'t':'s';
  localStorage.setItem(key,JSON.stringify(data[type]));
  if(editIndex[type]===i) cancelEdit(type);
  render();
}
function exportJSON(type){
  let blob;
  if(type==='about'){
    if(!data.about) return alert('No about');
    blob=new Blob([JSON.stringify(data.about,null,2)],{type:'application/json'});
  }else{
    blob=new Blob([JSON.stringify(data[type],null,2)],{type:'application/json'});
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=type+'.json'; a.click();
}
function handleProof(input){
  const file=input.files[0]; if(!file) return;
  document.getElementById('s-proof').value='images/evidence/'+file.name;
  const reader=new FileReader();
  reader.onload=(e)=>{document.getElementById('previewImg').src=e.target.result; document.getElementById('proofPreview').style.display='block'; document.getElementById('previewName').textContent=file.name;}; reader.readAsDataURL(file);
}
function handleWriteupImage(input){
  const file=input.files[0]; if(!file) return;
  document.getElementById('w-image').value='images/evidence/'+file.name;
  const reader=new FileReader();
  reader.onload=(e)=>{document.getElementById('w-preview-img').src=e.target.result; document.getElementById('w-preview').style.display='block';}; reader.readAsDataURL(file);
}
function importJSON(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const json=JSON.parse(e.target.result);
      const type=file.name.replace('.json','');
      if(type==='about'){data.about=json; localStorage.setItem('about',JSON.stringify(json)); fillAboutForm(json); render(); return;}
      if(data.hasOwnProperty(type)){data[type]=json; const key=type==='writeups'?'w':type==='cheatsheets'?'c':type==='tools'?'t':'s'; localStorage.setItem(key,JSON.stringify(json)); render();}
    }catch(err){alert('Invalid JSON');}
  }; reader.readAsText(file);
}
render();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>0xSoloh Viewer - READ ONLY</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>body{background:#080808;color:#ddd;font-family:monospace;margin:0} #viewer{max-width:900px;margin:20px auto} canvas{width:100%;background:#fff;margin-bottom:10px;border-radius:8px} .bar{background:#111;border-bottom:1px solid #222;padding:10px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}</style>
</head><body oncontextmenu="return false">
<div class="bar"><small style="color:#00FF41">0xSoloh // READ-ONLY VIEWER</small><small style="color:#666">Download disabled for public</small></div>
<div id="viewer"></div>
<script>
const url = new URLSearchParams(location.search).get('file');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
(async()=>{
 if(!url) return;
 const pdf = await pdfjsLib.getDocument(url).promise;
 for(let i=1;i<=pdf.numPages;i++){
  const page = await pdf.getPage(i);
  const vp = page.getViewport({scale:1.5});
  const c = document.createElement('canvas'); const ctx=c.getContext('2d');
  c.width=vp.width; c.height=vp.height;
  document.getElementById('viewer').appendChild(c);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
 }
})();
</script></body></html>

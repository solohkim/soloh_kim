<!doctype html><html><head><meta charset="utf-8"><title>0xSoloh Viewer - READ ONLY</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<meta name="robots" content="noindex, nofollow">
<style>
body{background:#080808;color:#ddd;font-family:monospace;margin:0;user-select:none} 
#viewer{max-width:900px;margin:20px auto;position:relative} 
canvas{width:100%;background:#fff;margin-bottom:10px;border-radius:8px;pointer-events:none} 
.bar{background:#111;border-bottom:1px solid #222;padding:10px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
#watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:70px;color:rgba(255,255,0,0.07);pointer-events:none;z-index:9;font-weight:bold}
#shield{position:fixed;inset:0;z-index:8}
</style>
</head><body oncontextmenu="return false">
<div class="bar"><small style="color:#00FF41">0xSoloh // READ-ONLY VIEWER</small><small style="color:#666">Download disabled for public</small></div>
<div id="watermark">0xSoloh • VERIFIED</div>
<div id="shield"></div>
<div id="viewer"></div>
<script>
// AUTO-SCAN MODE - any file in /certs/ works automatically
const params = new URLSearchParams(location.search).get('file') || '';
let raw = params.trim();

// FIX: Extract filename if main site sends /certs/xxx.pdf
if(raw.includes('/')) raw = raw.split('/').pop();
raw = decodeURIComponent(raw);

// Security: block path traversal
if(!raw || raw.includes('..') || raw.includes('\\')){
  document.getElementById('viewer').innerHTML = '<p style="text-align:center;margin-top:100px;color:#ff0">Invalid file.</p>';
  throw new Error('Blocked');
}

// Auto-add .pdf if not present, sanitize name
if(!raw.toLowerCase().endsWith('.pdf')) raw += '.pdf';
if(!/^[a-zA-Z0-9._-]+\.pdf$/i.test(raw)){
  document.getElementById('viewer').innerHTML = '<p style="text-align:center;margin-top:100px;color:#ff0">Invalid filename.</p>';
  throw new Error('Blocked');
}

let fileUrl = '/certs/' + raw;

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function addWatermark(c) {
  const ctx = c.getContext('2d');
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.font = 'bold ' + (c.width/18) + 'px monospace';
  ctx.fillStyle = '#00ff41';
  ctx.rotate(-0.45);
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 2;
  ctx.fillText('0xSoloh • kimsec.netlify.app • READ-ONLY', 60, c.height/2.2);
  ctx.fillText(new Date().toLocaleDateString() + ' • VERIFIED', 60, c.height/2.2 + 55);
  ctx.restore();
}

(async()=>{
 try{
  const pdf = await pdfjsLib.getDocument(fileUrl).promise;
  for(let i=1;i<=pdf.numPages;i++){
   const page = await pdf.getPage(i);
   const vp = page.getViewport({scale:1.5});
   const c = document.createElement('canvas'); const ctx=c.getContext('2d');
   c.width=vp.width; c.height=vp.height;
   document.getElementById('viewer').appendChild(c);
   await page.render({canvasContext:ctx,viewport:vp}).promise;
   addWatermark(c);
  }
 }catch(e){
  document.getElementById('viewer').innerHTML = '<p style="text-align:center;margin-top:100px;color:#ff0">File not found in vault: '+raw+'</p>';
 }
})();

document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('dragstart', e=>e.preventDefault());
document.addEventListener('keydown', e=>{
  if((e.ctrlKey && ['s','p','u','c','a'].includes(e.key.toLowerCase())) || e.key==='PrintScreen' || e.key==='F12'){
    e.preventDefault(); return false;
  }
});
</script></body></html>

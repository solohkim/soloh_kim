<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>0xSoloh // Vault</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--green:#00FF41;--gold:#FFD54F;--bg:#080808;--card:#111;--border:#1f1f1f}
body{background:var(--bg);color:#ddd;font-family:'JetBrains Mono',monospace}
.vault-card{background:#0f1410;border:1px solid #1c2a1c;border-radius:14px;overflow:hidden;transition:.3s;height:100%;display:flex;flex-direction:column}
.vault-card:hover{border-color:var(--green);transform:translateY(-5px);box-shadow:0 15px 35px rgba(0,255,65,.15)}
.vault-img{height:200px;background:#000;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #1c2a1c}
.vault-img img{width:140px;height:140px;border-radius:50%;border:4px solid #7AC74F;object-fit:cover}
.vault-body{padding:14px;flex:1;display:flex;flex-direction:column}
.vault-title{font-weight:800;font-size:.92rem;color:#e6e6e6}
.vault-meta{font-size:.7rem;color:#4a8a4a;margin:6px 0 8px 0}
.tag{font-size:.6rem;padding:2px 7px;border-radius:20px;border:1px solid #1f3d1f;color:var(--green);margin:2px;display:inline-block;background:rgba(0,255,65,.05)}
.top-menu{color:#ddd;text-decoration:none;font-size:.95rem;font-weight:600;margin-right:18px;cursor:pointer !important}
.top-menu:hover{color:var(--green)}
.top-menu.active{color:#fff !important;border-bottom:3px solid #fff}
.page-section{display:none}.page-section.active{display:block}
#reader{background:#0d1117!important;border:1px solid var(--green)!important}
</style></head><body>
<nav class="py-2 px-3 d-flex justify-content-between" style="background:#000;border-bottom:1px solid #222;position:sticky;top:0;z-index:11">
<div class="d-flex gap-3">
<a onclick="showPage('home')" id="nav-home" class="top-menu active">Home</a>
<a onclick="showPage('about')" id="nav-about" class="top-menu">About</a>
<a onclick="showPage('posts')" id="nav-posts" class="top-menu">Posts</a>
<a onclick="showPage('stats')" id="nav-stats" class="top-menu">Stats</a>
<a onclick="showPage('cheatsheets')" id="nav-cheatsheets" class="top-menu">Cheatsheets</a>
<a onclick="showPage('tools')" id="nav-tools" class="top-menu">Tools</a>
<a onclick="showPage('contact')" id="nav-contact" class="top-menu">Contact</a>
</div>
<a href="https://wa.me/254797003045" target="_blank" class="btn btn-sm" style="background:#00FF41;color:#000;font-weight:800">Chat</a>
</nav>
<div class="container py-4" style="max-width:1100px">
<div id="page-home" class="page-section active">
<h6 id="vault"><span style="color:#00FF41">~/</span>vault <small id="vaultCount"></small></h6>
<div id="vaultGrid" class="row g-3 mb-3"></div>
<div id="pagination" class="text-center mb-5"></div>
</div>
<div id="page-posts" class="page-section"><h4>~/posts</h4><div id="vaultGridPosts" class="row g-3 mt-3"></div></div>
<div id="page-about" class="page-section"><h4>$ cat about.txt</h4><p>0xSoloh — Nairobi, PenTester</p></div>
<div id="page-stats" class="page-section"><h4>~/stats</h4><p>Top 3% THM | Hacker HTB</p></div>
<div id="page-cheatsheets" class="page-section"><h4>~/cheatsheets</h4><div id="cheatsGrid" class="row g-3 mt-3"></div></div>
<div id="page-tools" class="page-section"><h4>~/tools</h4><div id="toolsGrid" class="row g-3 mt-3"></div></div>
<div id="page-contact" class="page-section"><h4>~/contact</h4><p>WhatsApp: +254797003045</p></div>
<div id="reader" style="display:none" class="card p-3 mb-5"><button onclick="reader.style.display='none'" class="btn btn-sm btn-outline-light mb-3">Close</button><div id="mdContent"></div></div>
</div>
<script>
let allWriteups=[];let currentPage=1;const perPage=8;
async function loadVault(){try{const res=await fetch('writeups.json');allWriteups=await res.json();renderVault()}catch(e){document.getElementById('vaultGrid').innerHTML='Missing writeups.json'}}
function renderVault(){
  const grid=document.getElementById('vaultGrid');const pag=document.getElementById('pagination');const count=document.getElementById('vaultCount');const gridPosts=document.getElementById('vaultGridPosts');
  const totalPages=Math.ceil(allWriteups.length/perPage)||1;const start=(currentPage-1)*perPage;const pageItems=allWriteups.slice(start,start+perPage);
  if(count) count.textContent=`${allWriteups.length} writeups • Page ${currentPage}/${totalPages}`;
  const html=pageItems.map(p=>{
    let iconHtml=p.image?`<img src="${p.image}" alt="${p.title}">`:`<div style="width:140px;height:140px;border-radius:50%;background:#111;border:4px solid #7AC74F;display:flex;align-items:center;justify-content:center;font-size:3.2rem">💻</div>`;
    const tags=p.tags||[];return `<div class="col-lg-3 col-md-4 col-sm-6"><div class="vault-card"><div class="vault-img">${iconHtml}</div><div class="vault-body"><div class="vault-title">${p.title}</div><div class="vault-meta">${p.date||''} · ${p.platform||''}</div><div class="mb-2">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><button onclick="openWriteup('${p.file}')" class="btn btn-sm w-100" style="background:#00FF41;color:#000;font-weight:800;margin-top:auto">Read</button></div></div></div>`;
  }).join('');
  if(grid) grid.innerHTML=html;
  if(gridPosts) gridPosts.innerHTML=allWriteups.map(p=>`<div class="col-lg-3 col-md-4 col-sm-6"><div class="vault-card"><div class="vault-img">${p.image?`<img src="${p.image}" style="width:140px;height:140px;border-radius:50%;border:4px solid #7AC74F;object-fit:cover">`:`💻`}</div><div class="vault-body"><div class="vault-title">${p.title}</div><button onclick="openWriteup('${p.file}')" class="btn btn-sm w-100" style="background:#00FF41;color:#000">Read</button></div></div></div>`).join('');
  if(pag){if(totalPages>1){let b='';for(let i=1;i<=totalPages;i++){b+=`<button class="pag-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`}pag.innerHTML=b}else{pag.innerHTML=''}}
}
function goPage(n){currentPage=n;renderVault();window.scrollTo(0,0)}
async function openWriteup(file){try{let path=file.replace('writeups/writeups/','writeups/');if(!path.startsWith('writeups/')) path='writeups/'+path.split('/').pop();const txt=await fetch(path).then(r=>r.text());document.getElementById('mdContent').innerHTML=marked.parse(txt);document.getElementById('reader').style.display='block';window.scrollTo(0,document.getElementById('reader').offsetTop-80);}catch(e){alert('Could not load '+file)}}
function showPage(name){document.querySelectorAll('.page-section').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+name).classList.add('active');document.querySelectorAll('.top-menu').forEach(a=>a.classList.remove('active'));const nav=document.getElementById('nav-'+name);if(nav) nav.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});document.getElementById('reader').style.display='none';}
loadVault();
</script></body></html>
